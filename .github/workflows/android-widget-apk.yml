# ハトルの仕事部屋ウィジェット（android-widget/）の debug APK を GitHub 上でビルドする。
# 結果は Actions の実行結果ページの「Artifacts」から hatoru-widget-debug-apk としてダウンロードできる。
name: Build hatoru widget APK

on:
  push:
    paths:
      - "android-widget/**"
      - ".github/workflows/android-widget-apk.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android-widget
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      # ランナー同梱の Android SDK を使う（android-actions/setup-android は古い tools パッケージで失敗するため使わない）
      - name: Install Android platform 34
        run: |
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-34" "build-tools;34.0.0"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      # gradle-wrapper.jar はリポジトリに含めていないため、ここで生成する
      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 8.9

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: hatoru-widget-debug-apk
          path: android-widget/app/build/outputs/apk/debug/app-debug.apk
