<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>制作サンプル｜季節のスイーツ Instagram投稿画像</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: "Hiragino Kaku Gothic ProN", "Hiragino Sans", "Noto Sans JP", sans-serif; background: #faf5ee; color: #4a2f28; }
  .sample-band { background: #b2543f; color: #fff; text-align: center; padding: 10px 16px; font-size: 14px; letter-spacing: .12em; font-weight: 700; }
  header { text-align: center; padding: 44px 20px 8px; }
  header .eyebrow { color: #b2543f; font-size: 13px; letter-spacing: .3em; font-weight: 700; }
  header h1 { font-size: 26px; margin: 12px 0 10px; line-height: 1.5; }
  header p { font-size: 14px; color: #7a5c50; line-height: 1.9; max-width: 560px; margin: 0 auto; }
  main { max-width: 480px; margin: 0 auto; padding: 28px 20px 12px; }
  figure { margin-bottom: 34px; }
  figure img { width: 100%; border-radius: 14px; box-shadow: 0 10px 28px rgba(74,47,40,.18); display: block; }
  figcaption { margin-top: 12px; font-size: 14px; color: #7a5c50; text-align: center; }
  figcaption b { color: #4a2f28; }
  .note { max-width: 480px; margin: 0 auto; padding: 0 20px 48px; font-size: 12.5px; color: #97816f; line-height: 1.9; }
</style>
</head>
<body>
<div class="sample-band">制作サンプル（応募用デモ）</div>
<header>
  <div class="eyebrow">SEASONAL SWEETS</div>
  <h1>季節のスイーツ<br>Instagram投稿画像サンプル</h1>
  <p>「季節のスイーツInstagram画像作成」の募集に合わせて制作したサンプルです。冬・クリスマスの季節スイーツをテーマに、フィード投稿用（1080×1350px）で3点制作しました。実案件では、ご支給の素材・テンプレート・テーマに沿って制作します。</p>
</header>
<main>
  <figure>
    <img src="img/01.jpg" alt="冬限定いちごのショートケーキの投稿画像サンプル">
    <figcaption><b>1. 冬限定スイーツの紹介</b>（いちごのショートケーキ）</figcaption>
  </figure>
  <figure>
    <img src="img/02.jpg" alt="クリスマスパフェの投稿画像サンプル">
    <figcaption><b>2. 季節限定メニューの告知</b>（クリスマスパフェ）</figcaption>
  </figure>
  <figure>
    <img src="img/03.jpg" alt="シュトーレンの投稿画像サンプル">
    <figcaption><b>3. おうちで楽しむ季節のおやつ</b>（シュトーレン）</figcaption>
  </figure>
</main>
<p class="note">※このページは制作サンプルです。実在の店舗・商品の紹介ではありません。写真はAI生成画像をもとに制作しています。制作：山田修平（Webアプリ4つを企画・運営し、公式SNSの投稿画像・動画を毎日制作）</p>
</body>
</html>
